name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (non-blocking style check)
        run: ruff check . --exit-zero

      - name: Check imports
        run: |
          python -c "import src.data.preprocessing"
          python -c "import src.data.validation"
          python -c "import src.models.train"
          python -c "import src.models.evaluate"
          python -c "import src.models.inference"
          python -c "import src.models.model_registry"
          python -c "import src.explainability.shap_explainer"
          python -c "import src.genai.explainer"
          python -c "import api.main"

      - name: Run tests
        run: pytest -q
        # No OPENAI_API_KEY is set here on purpose — tests must pass in
        # fallback/mocked mode, proving the app never hard-depends on a
        # live GenAI call.
